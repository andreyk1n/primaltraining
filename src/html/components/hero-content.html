<section class="hero-content">
    <div class="hero-content__container">
        <img src="@img/hero/hero-main.jpg" alt="Hero main image" class="hero-content__image" draggable="false">
        <div class="hero-content__content">
            <h2 class="hero-content__title anek-tamil-bold">@@title</h2>
            <div class="hero-content__text">
                <p class="hero-content__description geist">@@description</p>
                <a href="@@link" class="hero-content__link geist-mono">@@button</a>
            </div>
        </div>
    </div>
</section>

<section class="cta @@if (modifier) {@@modifier}">
    <div class="cta__container">
        @@if (label) {
            <p class="cta__label geist">@@label</p>
        }
        @@if (title) {
            <h2 class="cta__title anek-tamil-bold">@@title</h2>
        }
        @@if (link) {
            <a href="@@link" class="button button--white">
                @@if (linkText) {@@linkText}
            </a>
        }
    </div>
</section>

<div class="chess chess--violet">
    <div class="chess__container">
        <div class="chess__text">
            <h2 class="chess__title anek-tamali">@@title</h2>
            <div class="chess__subtext">
                <h3 class="chess__subtitle anek-tamalittu">@@subtitle</h3>
                <p class="chess__description geist">@@description</p>
            </div>
        </div>
        <img src="@img/chess/@@image" alt="Chess image" class="chess__image" draggable="false">

    </div>
</div>
